# Runs the backend's tests on every push and pull request. They use an
# in-memory database (src/test/resources/config), so nothing else is needed.
name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/fitness-tracker
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # mvnw isn't marked executable in the repo, so run it with sh.
      - name: Run tests
        run: sh mvnw -B test

      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/fitness-tracker/target/surefire-reports/
