# Runs the browser tests (tests/browser) on every push and pull request:
# headless Chrome against a throwaway backend that run.cjs starts itself.
name: Browser tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs.
      - name: Let Chrome use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install
        run: npm ci

      # run.cjs builds the backend jar first, then finds Chrome at
      # /usr/bin/google-chrome (already on the runner).
      - name: Run tests
        run: npm test

      - name: Keep the screenshots if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: test screenshots/
