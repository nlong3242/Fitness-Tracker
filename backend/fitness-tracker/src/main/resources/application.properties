spring.application.name=fitness-tracker

# Hosts like Railway/Render tell the app which port to listen on via PORT.
server.port=${PORT:8080}

# Override via APP_DB_PATH in deployments to point at a persistent volume.
spring.datasource.url=jdbc:h2:file:${APP_DB_PATH:./data/fitness};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

# Code testers need to sign up (AuthService). Blank = sign-up closed.
# Set via APP_INVITE_CODE (dev-phone.ps1 sets one for local use).
app.signup.invite-code=${APP_INVITE_CODE:}

# Comma-separated frontend origins allowed to call the API.
# Override via APP_CORS_ORIGINS in deployments.
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://127.0.0.1:5500}

# Suppress the unused default "user" + random password Spring Security
# would otherwise log on every boot. Auth is via the login-token filter;
# HTTP Basic and form login are disabled in SecurityConfig.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# The built-in exercises loaded at start-up (BuiltInExercises).
app.builtin-exercises=classpath:builtin-exercises.json

# Compress JSON responses (the exercise list is hundreds of rows); the
# browser and the phone's web view ask for it and unpack it themselves.
server.compression.enabled=true
