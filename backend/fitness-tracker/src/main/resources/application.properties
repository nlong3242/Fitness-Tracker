spring.application.name=fitness-tracker

spring.datasource.url=jdbc:h2:file:./data/fitness;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

# Single-user API key. Override in deployments via APP_API_KEY env var.
app.api-key=${APP_API_KEY:dev-key}
