# Layered over src/main/resources/application.properties (config/ wins) so
# tests get an in-memory database: they never touch data/fitness and still
# run while the dev backend holds its file lock. Flyway builds the schema.
spring.datasource.url=jdbc:h2:mem:fitness-test;DB_CLOSE_DELAY=-1

# Sign-up is closed without a code; TestAuth.INVITE_CODE matches this.
app.signup.invite-code=test-invite

# A small fixed set of built-in exercises, so the real list can change freely.
app.builtin-exercises=classpath:builtin-exercises-test.json
