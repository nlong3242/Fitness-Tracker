<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- maximum-scale=1 stops iOS Safari auto-zooming when an input under
         16px is focused; pinch-zoom still works. viewport-fit=cover lets
         the safe-area insets in the CSS take effect under the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2A1F1E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tsu2Track">
    <title>Tsu2Track</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="app-content"></div>
    <nav id="bottom-nav"></nav>
    <script type="module" src="src/main.js"></script>
</body>
</html>
