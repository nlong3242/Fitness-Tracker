<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- maximum-scale=1 stops iOS Safari auto-zooming when an input under
         16px is focused; pinch-zoom still works. viewport-fit=cover lets
         the safe-area insets in the CSS take effect under the notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F4E9D8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- No apple-mobile-web-app-status-bar-style: "black-translucent" makes
         iOS 26 lay the Home Screen app out one status bar short, leaving an
         unpainted band under the bottom nav (WebKit bug 301108). The default
         status bar sits above the page instead. iOS reads this at install
         time, so re-add the app to the Home Screen after changing it. -->
    <meta name="apple-mobile-web-app-title" content="Tsu2Track">
    <title>Tsu2Track</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <!-- #app-scroll is the only scrolling element (see layout/page.css). -->
    <div id="app-scroll"><div id="app-content"></div></div>
    <div id="resume-banner" hidden></div>
    <nav id="bottom-nav"></nav>
    <script type="module" src="src/main.js"></script>
</body>
</html>
